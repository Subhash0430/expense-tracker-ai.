{% extends 'tracker/base.html' %}

{% block content %}

<div class="card shadow-sm" style="height:80vh; display:flex; flex-direction:column; border-radius:20px;">

  <!-- Header -->
  <div style="padding:15px; border-bottom:1px solid #eee;">
    <h5 class="mb-0 fw-bold">🤖 AI Assistant</h5>
    <small style="color:#888;">Ask about your expenses</small>
  </div>

  <!-- Chat Box -->
  <div id="chat-box" style="flex:1; overflow-y:auto; padding:15px; background:#f9f9fb;"></div>

  <!-- Input -->
  <form id="chat-form" style="padding:15px; border-top:1px solid #eee;">
    {% csrf_token %}
    <div class="d-flex gap-2">
      <input id="msg" class="form-control" placeholder="Ask something..." required>
      <button class="btn btn-primary">Send</button>
    </div>
  </form>

</div>

<style>
.user-msg { text-align: right; margin-bottom: 10px; }
.ai-msg { text-align: left; margin-bottom: 10px; }

.bubble {
  display: inline-block;
  padding: 10px 14px;
  border-radius: 15px;
  max-width: 70%;
  font-size: 14px;
}

.user-bubble {
  background: #f953c6;
  color: white;
}

.ai-bubble {
  background: white;
  border: 1px solid #ddd;
}
</style>

<script>
const box = document.getElementById("chat-box");

document.getElementById("chat-form").onsubmit = async (e) => {
  e.preventDefault();

  let input = document.getElementById("msg");
  let message = input.value;

  // Show user message
  box.innerHTML += `
    <div class="user-msg">
      <div class="bubble user-bubble">${message}</div>
    </div>
  `;

  input.value = "";

  // Send request
  let res = await fetch("/chat-api/", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": "{{ csrf_token }}"
    },
    body: JSON.stringify({message: message})
  });

  let data = await res.json();

  // Show AI reply
  box.innerHTML += `
    <div class="ai-msg">
      <div class="bubble ai-bubble">${data.reply}</div>
    </div>
  `;

  box.scrollTop = box.scrollHeight;
};
</script>

{% endblock %}
